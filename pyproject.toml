[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "FURB"]

[tool.ruff.lint.per-file-ignores]
# El prompt es prosa dentro de un f-string. Reajustar los saltos de linea para
# cumplir el limite cambiaria lo que recibe el modelo.
"src/infrastructure/bedrock_writer.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
