AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bootstrap: el bucket donde CloudFormation guarda el codigo empaquetado de la
  Lambda. Existe en su propio stack porque hay que crearlo ANTES de poder
  desplegar nada mas - es el problema del huevo y la gallina de cualquier IaC.
  Se despliega una vez y no se vuelve a tocar.

Resources:

  ArtefactosBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "postales-artefactos-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: caducar-versiones-antiguas
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

Outputs:
  Bucket:
    Description: Bucket de artefactos de despliegue.
    Value: !Ref ArtefactosBucket
