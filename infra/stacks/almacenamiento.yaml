AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Capa de almacenamiento: la memoria del agente y el archivo publico.
  Ambos recursos llevan DeletionPolicy Retain porque contienen las postales
  ya escritas: borrar el stack no debe borrar lo que el agente creo.

Parameters:
  NombreBucket:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"

Resources:

  SitioBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref NombreBucket
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  SitioBucketPolitica:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SitioBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LecturaPublica
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${SitioBucket.Arn}/*"

  HistorialTabla:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: postales-historial
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  NombreBucket:
    Value: !Ref SitioBucket
  ArnBucket:
    Value: !GetAtt SitioBucket.Arn
  NombreTabla:
    Value: !Ref HistorialTabla
  ArnTabla:
    Value: !GetAtt HistorialTabla.Arn
  WebPublica:
    Value: !Sub "http://${SitioBucket}.s3-website-${AWS::Region}.amazonaws.com"
