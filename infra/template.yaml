AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Postales del Ecuador - un agente autonomo que elige un lugar del Ecuador,
  consulta su clima real y escribe una postal, sin intervencion humana.

Parameters:

  NombreBucket:
    Type: String
    Description: Nombre global del bucket que sirve la web publica.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"

  ModeloBedrock:
    Type: String
    Default: amazon.nova-pro-v1:0
    Description: Modelo de Amazon Bedrock que escribe las postales.

  Frecuencia:
    Type: String
    Default: cron(0 6 * * ? *)
    Description: Cada cuanto despierta el agente.

  ZonaHoraria:
    Type: String
    Default: America/Guayaquil
    Description: Zona horaria de la expresion de frecuencia.

  RetencionLogs:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: Dias que se conservan los logs del agente.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 120
    MemorySize: 512
    Tracing: Active
    Architectures: [arm64]

Resources:

  # --------------------------------------------- la memoria del agente
  HistorialTabla:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-historial"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ------------------------------------- el archivo publico y la galeria
  SitioBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref NombreBucket
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  SitioBucketPolitica:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SitioBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LecturaPublica
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${SitioBucket.Arn}/*"

  # ------------------------------------------------ los logs del agente
  # Declarado a proposito para fijarle retencion: por defecto CloudWatch
  # guarda los logs para siempre, y se pagan para siempre.
  AgenteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}"
      RetentionInDays: !Ref RetencionLogs

  # ------------------------------------------------------- el cerebro
  AgenteFuncion:
    Type: AWS::Serverless::Function
    DependsOn: AgenteLogGroup
    Properties:
      FunctionName: !Ref AWS::StackName
      Description: Escribe una postal desde un lugar del Ecuador segun su clima real.
      CodeUri: ../src
      Handler: handler.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref HistorialTabla
          BUCKET_NAME: !Ref SitioBucket
          MODEL_ID: !Ref ModeloBedrock
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HistorialTabla
        - S3WritePolicy:
            BucketName: !Ref SitioBucket
        # Acotado al modelo concreto, no a "*"
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModeloBedrock}"
      Events:
        Despertador:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-despertador"
            Description: Despierta al agente para que escriba la postal del dia.
            ScheduleExpression: !Ref Frecuencia
            ScheduleExpressionTimezone: !Ref ZonaHoraria
            Input: '{"origen":"scheduler"}'

  # ----------------------------------------------- avisar si se rompe
  AlertasTema:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alertas"
      DisplayName: Postales del Ecuador - alertas

  AgenteFallaAlarma:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-fallos"
      AlarmDescription: >
        El agente fallo al escribir. Nadie mira los logs a las seis de la manana,
        asi que esta alarma es la unica forma de enterarse.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AgenteFuncion
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertasTema

Outputs:

  WebPublica:
    Description: La galeria publica de postales.
    Value: !Sub "http://${SitioBucket}.s3-website-${AWS::Region}.amazonaws.com"

  Bucket:
    Description: Bucket que almacena las postales y sirve la web.
    Value: !Ref SitioBucket

  Funcion:
    Description: La Lambda que contiene al agente.
    Value: !Ref AgenteFuncion

  Tabla:
    Description: La memoria del agente.
    Value: !Ref HistorialTabla

  TemaAlertas:
    Description: Suscribe tu correo aqui para enterarte si el agente falla.
    Value: !Ref AlertasTema
